# Project-wide Gradle settings.
# Optimized for low-end machines (2 GB RAM cap).

# JVM memory settings — keep at 2 GB to avoid OOM on low-end machines
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel project execution
org.gradle.parallel=true

# Enable Gradle build cache
org.gradle.caching=true

# AndroidX support
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Disable Jetifier (not needed when using AndroidX directly)
android.enableJetifier=false

# Enable configuration cache for faster builds
org.gradle.configuration-cache=true

